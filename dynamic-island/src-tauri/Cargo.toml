[package]
name = "dynamic-island"
version = "3.0.0"
description = "Dynamic Island + Dock ultra-ringan untuk Windows 10/11"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["audio"]
# Volume/mute/meter via COM. Jika gagal kompilasi: cargo build --release --no-default-features
audio = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
png = "0.17"
# WinRT (GSMTC) + COM audio. Win32 lain memakai FFI manual di sys.rs.
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = "s"      # ukuran kecil = lebih sedikit halaman memori
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
